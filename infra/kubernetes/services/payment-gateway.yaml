apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  labels:
    app: payment-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: payment-gateway
          image: your-dockerhub-username/payment-gateway:latest # Replace with your actual image
          ports:
            - containerPort: 8080
          env:
            - name: PAYMENT_GATEWAY_PORT
              value: "8080"
            - name: DATABASE_URL # Example - replace with your actual database connection string
              value: "postgresql://user:password@db-service:5432/payment_db"
            - name: REDIS_HOST # Example - replace with your actual redis host
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway-service
spec:
  selector:
    app: payment-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-gateway-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: payment.example.com # Replace with your actual domain
      http:
        paths:
          - path: /payment
            pathType: Prefix
            backend:
              service:
                name: payment-gateway-service
                port:
                  number: 80