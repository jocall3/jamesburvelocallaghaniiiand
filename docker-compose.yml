version: '3.9'

# Sovereign Core Microservices
# This file orchestrates the deployment of the application stack.
# A .env file is required in the same directory to provide environment variables.
# Example .env file:
#
# # PostgreSQL Configuration
# POSTGRES_DB=sovereign_core
# POSTGRES_USER=sovereign_user
# POSTGRES_PASSWORD=your_strong_password
#
# # Application Ports
# GATEWAY_PORT=8080
#
# # JWT Configuration (for auth-service)
# JWT_SECRET=your_super_secret_jwt_key
# JWT_EXPIRATION=1d

services:
  db:
    image: postgres:15-alpine
    container_name: sovereign_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sovereign-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: sovereign_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sovereign-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: sovereign_api_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      # These would be the addresses of the internal services
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - sovereign-net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: sovereign_auth_service
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://cache:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - sovereign-net

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: sovereign_user_service
    restart: unless-stopped
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - sovereign-net

# Define the network for inter-service communication
networks:
  sovereign-net:
    driver: bridge

# Define the volume for persistent database storage
volumes:
  postgres_data:
    driver: local