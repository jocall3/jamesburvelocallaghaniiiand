purpose: "Analyzes and scores founder backgrounds against a configurable investment thesis, leveraging public and private data sources to identify signals of potential success and alignment."
dependencies:
  - "APP_00_Core_SDK"
  - "APP_02_Data_GraphNexus"
  - "APP_03_Data_UnifiedAPIGateway"
  - "APP_11_Governance_ThesisManager"
invalidation_conditions:
  - "Updates to the core investment thesis managed by APP_11_Governance_ThesisManager."
  - "Significant changes in the underlying data sources or API schemas from APP_03_Data_UnifiedAPIGateway."
  - "Detection of significant drift in the scoring model's performance against ground truth."
  - "Discovery of systemic bias in the scoring algorithm, requiring recalibration or model replacement."
  - "Deprecation of a key analytical model or feature used in the scoring pipeline."
adjacent_apps:
  - name: "APP_11_Governance_ThesisManager"
    relationship: "INPUT_PROVIDER"
    description: "Provides the investment thesis, criteria, and weighting parameters used for scoring."
  - name: "APP_12_Analysis_DealflowTriage"
    relationship: "DOWNSTREAM_CONSUMER"
    description: "Consumes founder scores as a primary signal for prioritizing and routing incoming investment opportunities."
  - name: "APP_25_Analysis_PortfolioSynergyMapper"
    relationship: "DATA_ENRICHMENT_SOURCE"
    description: "Uses founder background data to map potential synergies and expertise connections within the existing portfolio."
  - name: "APP_37_Governance_AuditTrailEngine"
    relationship: "AUDIT_SINK"
    description: "Receives detailed logs of all scoring runs, including inputs, model versions, and final scores for compliance and review."
  - name: "APP_58_Narrative_ModelExplainabilityUI"
    relationship: "VISUALIZATION_LAYER"
    description: "Provides a user interface to visualize and understand the factors contributing to a specific founder's score."