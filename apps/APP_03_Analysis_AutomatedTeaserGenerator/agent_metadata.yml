agent_metadata:
  purpose: "Automatically generate standardized investment teasers from unstructured pitch decks, focusing on key investment highlights and market potential."
  dependencies:
    - "External document storage (e.g., S3, Azure Blob, Google Cloud Storage)"
    - "OpenAI API (for advanced summarization and content generation)"
    - "Anthropic API (for alternative summarization and safety checks)"
    - "Document parsing library (e.g., Apache Tika, custom PDF/PPTX parser)"
    - "Common Core SDK (for auth, logging, event bus)"
  invalidation_conditions:
    - "Significant changes in LLM API capabilities or pricing models."
    - "Major shifts in standard pitch deck formats or investment teaser expectations."
    - "Breaking changes in external document storage APIs."
    - "Inability to maintain a high accuracy/relevance score for generated teasers."
    - "Regulatory changes impacting automated financial document processing."
  adjacent_apps:
    - "APP_05_Analysis_TAMProjectionEngine"
    - "APP_07_Analysis_CompetitiveLandscapeMapper"
    - "APP_11_Prompt_TemplateRegistry"
    - "APP_37_Governance_AuditTrailEngine"
    - "APP_42_Evaluation_ContentQualityAssessor"