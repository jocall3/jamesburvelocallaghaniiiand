syntax = "proto3";

package aetherium.ontology.ai.inference;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/aetherium-ecosystem/ontology/gen/go/ai/inference;inferencepb";
option java_package = "com.aetherium.ontology.ai.inference";
option java_multiple_files = true;

// InferenceRequest is the standardized, multi-modal, multi-provider request object.
// It serves as the core data contract for any service performing or routing AI inference.
message InferenceRequest {
  // Unique identifier for this specific request, generated by the client or initial gateway.
  string request_id = 1;

  // Identifier for tracing the request across multiple services in the ecosystem.
  string trace_id = 2;

  // Identifier for the tenant (organization or user) making the request.
  // Used for billing, rate limiting, and policy enforcement.
  string tenant_id = 3;

  // Specification of the desired model or capabilities.
  // This allows for both direct model selection and abstract capability-based routing.
  ModelSpec model_spec = 4;

  // A list of content parts forming the input prompt or context.
  // The order is significant, especially for conversational models.
  repeated ContentPart inputs = 5;

  // Parameters controlling the generation process of the model.
  InferenceParameters parameters = 6;

  // A list of tools (functions) that the model can be instructed to call.
  repeated Tool tools = 7;

  // Contextual information for policy engines (e.g., governance, compliance).
  PolicyContext policy_context = 8;

  // Arbitrary metadata for routing hints, cost limits, priority, etc.
  // Example: {"priority": "high", "max_cost_usd": "0.50"}
  google.protobuf.Struct metadata = 9;

  // Timestamp of when the request was created by the client.
  google.protobuf.Timestamp created_at = 10;
}

// InferenceResponse is the standardized response object.
// It encapsulates the model's output, usage metrics, and execution metadata.
message InferenceResponse {
  // Unique identifier for this response.
  string response_id = 1;

  // The ID of the request this response corresponds to.
  string request_id = 2;

  // The trace ID from the original request.
  string trace_id = 3;

  // The actual model specification that was used to fulfill the request.
  // This is important for logging and billing, as routing may have selected a different model
  // than what was originally requested.
  ModelSpec model_used = 4;

  // A list of output choices generated by the model.
  // Typically contains one choice, but some models/providers support multiple.
  repeated Choice choices = 5;

  // Aggregated usage metrics for the entire request/response cycle.
  UsageMetrics usage = 6;

  // Latency measurements for different parts of the inference process.
  LatencyBreakdown latency = 7;

  // The calculated cost of the inference operation.
  Cost cost = 8;

  // If an error occurred during processing, this field will be populated.
  InferenceError error = 9;

  // Arbitrary metadata from the provider or internal services.
  google.protobuf.Struct provider_metadata = 10;

  // Timestamp of when the response was generated.
  google.protobuf.Timestamp created_at = 11;
}

// A single content part, which can be text, image, audio, etc.
// This structure supports multi-modal inputs.
message ContentPart {
  // The role of this content part in a conversation.
  ContentRole role = 1;

  // The actual content, which can be one of several types.
  oneof content {
    string text = 2;
    ImagePart image = 3;
    AudioPart audio = 4;
    VideoPart video = 5;
    ToolResult tool_result = 6;
    google.protobuf.Struct structured_data = 7;
  }
}

// Specifies the desired model, either directly or by its capabilities.
message ModelSpec {
  // The provider ID, e.g., "openai", "anthropic", "google-gemini", "aetherium-router".
  string provider_id = 1;

  // The specific model ID, e.g., "gpt-4-turbo", "claude-3-opus-20240229".
  string model_id = 2;

  // A list of required capabilities for abstract routing, e.g., "tool_calling", "json_mode", "vision".
  repeated string capabilities = 3;

  // An optional endpoint override for custom deployments or fine-tuned models.
  string endpoint_override = 4;
}

// Parameters that control the model's generation behavior.
message InferenceParameters {
  // Controls randomness. Lower values make the model more deterministic. (0.0 to 2.0)
  optional float temperature = 1;

  // Nucleus sampling parameter. The model considers tokens with top_p probability mass. (0.0 to 1.0)
  optional float top_p = 2;

  // The maximum number of tokens to generate in the completion.
  optional int32 max_tokens = 3;

  // Sequences where the API will stop generating further tokens.
  repeated string stop_sequences = 4;

  // Penalizes new tokens based on whether they appear in the text so far. (-2.0 to 2.0)
  optional float presence_penalty = 5;

  // Penalizes new tokens based on their existing frequency in the text so far. (-2.0 to 2.0)
  optional float frequency_penalty = 6;

  // Specifies the format of the response, e.g., "json_object" for guaranteed JSON output.
  string response_format = 7;

  // Seed for deterministic outputs (if supported by the model).
  optional int64 seed = 8;

  // If true, the response will be streamed back as chunks.
  bool stream = 9;
}

// A tool (or function) that the model can invoke.
message Tool {
  // The name of the function to be called.
  string name = 1;

  // A description of what the function does, used by the model to decide when to call it.
  string description = 2;

  // The parameters the function accepts, described as a JSON Schema object.
  google.protobuf.Struct parameters_schema = 3;
}

// Context for applying governance and compliance policies.
message PolicyContext {
  // The geographical or legal jurisdiction relevant to the request, e.g., "EU", "US-CA".
  string jurisdiction = 1;

  // Data residency requirements, e.g., "EU_ONLY".
  string data_residency_requirement = 2;

  // Classification of the user or data, e.g., "PII_ACCESS", "INTERNAL_ONLY".
  repeated string classifications = 3;
}

// Represents a single choice of output from the model.
message Choice {
  // The index of this choice in the list of choices.
  int32 index = 1;

  // The primary content of the response.
  ContentPart message = 2;

  // The reason the model stopped generating tokens.
  FinishReason finish_reason = 3;

  // Log probabilities of the generated tokens, if requested.
  LogProbs logprobs = 4;
}

// The result of a tool call, provided as input to the model in a subsequent turn.
message ToolResult {
  // The ID of the tool call this result corresponds to.
  string tool_call_id = 1;

  // The output of the tool, typically a JSON string.
  string content = 2;
}

// A request from the model to call one or more tools.
message ToolCall {
  // A unique identifier for this specific tool call.
  string id = 1;

  // The name of the function to be called.
  string function_name = 2;

  // The arguments to call the function with, as a JSON string.
  string arguments = 3;
}

// Represents an image content part.
message ImagePart {
  // MIME type of the image, e.g., "image/jpeg", "image/png".
  string mime_type = 1;

  // The source of the image data.
  oneof source {
    bytes data = 2; // Raw image data.
    string uri = 3;  // URI of the image (e.g., "data:image/jpeg;base64,...", "http://...").
  }
  // Image detail level for vision models ("low", "high", "auto").
  string detail = 4;
}

// Represents an audio content part.
message AudioPart {
  string mime_type = 1; // e.g., "audio/mp3", "audio/wav"
  oneof source {
    bytes data = 2;
    string uri = 3;
  }
}

// Represents a video content part.
message VideoPart {
  string mime_type = 1; // e.g., "video/mp4"
  oneof source {
    bytes data = 2;
    string uri = 3;
  }
}

// Token usage metrics for the inference operation.
message UsageMetrics {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
  // Provider-specific metrics that don't fit the standard model.
  google.protobuf.Struct provider_specific = 4;
}

// Detailed latency breakdown.
message LatencyBreakdown {
  // Total end-to-end latency from the gateway's perspective.
  int64 total_gateway_ms = 1;
  // Time spent waiting in the queue before processing.
  int64 queue_ms = 2;
  // Time taken by the upstream provider to process the request.
  int64 provider_ms = 3;
  // Time to first token (for streaming responses).
  int64 tfft_ms = 4;
}

// Cost of the inference operation.
message Cost {
  string currency = 1; // e.g., "USD"
  double total_cost = 2;
  double prompt_cost = 3;
  double completion_cost = 4;
}

// Detailed error information.
message InferenceError {
  // A standardized error code from the Aetherium ecosystem.
  string error_code = 1;
  // A human-readable error message.
  string message = 2;
  // The original error code from the provider, if any.
  string provider_error_code = 3;
  // The original error message from the provider.
  string provider_error_message = 4;
  // Indicates if the request can be safely retried.
  bool is_retryable = 5;
}

// Log probability information for generated tokens.
message LogProbs {
  // A list of log probability information for each token in the generated content.
  repeated TokenLogProb tokens = 1;
}

message TokenLogProb {
  // The token string.
  string token = 1;
  // The log probability of this token.
  double logprob = 2;
  // A list of the most likely alternative tokens and their log probabilities.
  repeated TopLogProb top_logprobs = 3;
}

message TopLogProb {
  string token = 1;
  double logprob = 2;
}

// The role of a content part in a conversation.
enum ContentRole {
  ROLE_UNSPECIFIED = 0;
  // Input from the end-user.
  USER = 1;
  // The model's response.
  ASSISTANT = 2;
  // Initial instructions or context for the model.
  SYSTEM = 3;
  // The result of a tool call.
  TOOL = 4;
}

// The reason a model stopped generating output.
enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  // The model generated a natural stop sequence.
  STOP = 1;
  // The output reached the maximum token limit.
  LENGTH = 2;
  // The model decided to call one or more tools.
  TOOL_CALLS = 3;
  // The output was flagged by a content filter.
  CONTENT_FILTER = 4;
  // An error occurred during generation.
  ERROR = 5;
}