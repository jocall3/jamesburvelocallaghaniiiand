/system/logs:
  get:
    summary: Stream Raw System Logs
    operationId: streamSystemLogs
    tags:
      - System Logs
      - Streaming
      - Monitoring
    description: |
      Establishes a persistent connection to stream raw system logs in real-time or retrieve historical logs.
      This endpoint is designed for comprehensive monitoring, debugging, and seamless integration with external log analysis platforms.
      Logs can be streamed as newline-delimited JSON (NDJSON) for structured processing or as plain text for raw output,
      depending on the client's preference specified via the `format` parameter.
      The connection can be kept open indefinitely to receive new log entries as they are generated (live tailing),
      or it can be configured to close after a specified limit of entries or a defined time range has been retrieved.
      This allows for both continuous observation and bounded historical data retrieval.
      Clients should be prepared to handle a continuous stream of data, potentially requiring robust error handling
      and reconnection logic for long-running streams.
    parameters:
      - $ref: '#/components/parameters/LogLevelFilter'
      - $ref: '#/components/parameters/LogSourceFilter'
      - $ref: '#/components/parameters/LogStartTime'
      - $ref: '#/components/parameters/LogEndTime'
      - $ref: '#/components/parameters/LogLimit'
      - $ref: '#/components/parameters/LogFollow'
      - $ref: '#/components/parameters/LogFormat'
      - $ref: '#/components/parameters/LogStreamId'
    security:
      - ApiKeyAuth: []
      - BearerAuth: []
    responses:
      '200':
        description: |
          Successfully established a log stream.
          Logs are streamed as newline-delimited JSON (NDJSON) or plain text, depending on the `format` parameter.
          The connection will remain open as long as new logs are available and the `follow` parameter is true,
          or until the specified `limit` or `endTime` is reached.
          Clients should be prepared to handle a continuous stream of data.
        content:
          application/x-ndjson:
            schema:
              type: object # Represents a single log entry, streamed as part of a newline-delimited JSON (NDJSON) stream.
              description: |
                A single log entry object, streamed as part of a newline-delimited JSON (NDJSON) stream.
                Each line in the response body will be a valid JSON object conforming to this schema.
                This format is ideal for structured log processing and integration with log aggregation systems.
              properties:
                timestamp:
                  type: string
                  format: date-time
                  description: The ISO 8601 timestamp (e.g., `2023-10-27T10:00:00.123Z`) when the log entry was generated by the source system.
                  example: 2023-10-27T10:00:00.123Z
                level:
                  type: string
                  enum:
                    - TRACE
                    - DEBUG
                    - INFO
                    - WARN
                    - ERROR
                    - FATAL
                  description: The severity level of the log entry, indicating its importance or impact.
                  example: INFO
                source:
                  type: string
                  description: The name of the service, component, or application that generated the log entry (e.g., `auth-service`, `data-processor`, `api-gateway`).
                  example: auth-service
                message:
                  type: string
                  description: The primary human-readable log message, often containing details about the event.
                  example: User 'john.doe' logged in successfully.
                requestId:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    An optional unique identifier for the request or transaction associated with this log.
                    Useful for tracing operations across multiple services that are part of a single user request.
                  example: abc-123-xyz-456
                userId:
                  type: string
                  nullable: true
                  description: The ID of the user associated with the log entry, if applicable. This helps in auditing user activities.
                  example: user-123
                sessionId:
                  type: string
                  nullable: true
                  description: The ID of the session associated with the log entry, if applicable. Useful for tracking user sessions.
                  example: sess-789
                traceId:
                  type: string
                  nullable: true
                  description: |
                    A distributed tracing ID, correlating logs across different services in a distributed system.
                    Follows OpenTelemetry or similar tracing standards.
                  example: 5e0f8a7b-1c2d-3e4f-5a6b-7c8d9e0f1a2b
                spanId:
                  type: string
                  nullable: true
                  description: |
                    A span ID within a trace, representing a specific operation or unit of work.
                    Used in conjunction with `traceId` for detailed performance analysis.
                  example: 1a2b3c4d5e6f
                metadata:
                  type: object
                  nullable: true
                  description: |
                    Additional arbitrary key-value pairs providing context for the log entry.
                    This can include specific error codes, performance metrics, database query details,
                    or any other relevant structured data that enhances log analysis.
                  additionalProperties: true
                  example:
                    latencyMs: 500
                    endpoint: /api/v1/data
                    errorCode: AUTH_FAILED
                    databaseTable: users
                    queryTimeMs: 15
            examples:
              realtimeStreamNDJSON:
                summary: Example of a real-time log stream (NDJSON)
                value: |
                  {"timestamp":"2023-10-27T10:00:00.123Z","level":"INFO","source":"auth-service","message":"User 'john.doe' logged in successfully.","requestId":"abc-123-xyz-456","userId":"user-123"}
                  {"timestamp":"2023-10-27T10:00:00.456Z","level":"DEBUG","source":"data-processor","message":"Processing batch 'batch-xyz' item 5/100.","traceId":"5e0f8a7b-1c2d-3e4f-5a6b-7c8d9e0f1a2b","spanId":"1a2b3c4d5e6f","metadata":{"batchId":"batch-xyz","processedItems":5}}
                  {"timestamp":"2023-10-27T10:00:01.789Z","level":"WARN","source":"api-gateway","message":"High latency detected for endpoint /api/v1/data.","requestId":"def-456-uvw-789","metadata":{"latencyMs":500,"endpoint":"/api/v1/data","httpStatus":200}}
                  {"timestamp":"2023-10-27T10:00:02.000Z","level":"ERROR","source":"database","message":"Failed to connect to primary database replica.","metadata":{"errorCode":"DB_CONN_FAILED","retries":3,"databaseHost":"db-primary-01"}}
          text/plain:
            schema:
              type: string
              description: |
                Raw plain text log lines. Each line represents a single log entry, formatted by the server.
                The exact format may vary but typically includes timestamp, level, source, and message,
                often followed by key-value pairs for additional context. This format is suitable for
                direct human readability or simple text-based log parsers.
            examples:
              rawTextStream:
                summary: Example of a raw text log stream
                value: |
                  2023-10-27T10:00:00.123Z INFO auth-service: User 'john.doe' logged in successfully. [requestId=abc-123-xyz-456, userId=user-123]
                  2023-10-27T10:00:00.456Z DEBUG data-processor: Processing batch 'batch-xyz' item 5/100. [traceId=5e0f8a7b-1c2d-3e4f-5a6b-7c8d9e0f1a2b, processedItems=5]
                  2023-10-27T10:00:01.789Z WARN api-gateway: High latency detected for endpoint /api/v1/data. (latencyMs=500, endpoint=/api/v1/data, httpStatus=200)
                  2023-10-27T10:00:02.000Z ERROR database: Failed to connect to primary database replica. (errorCode=DB_CONN_FAILED, retries=3, databaseHost=db-primary-01)
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '500':
        $ref: '#/components/responses/InternalServerError'