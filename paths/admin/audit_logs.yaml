/admin/audit_logs:
  get:
    summary: Retrieve a comprehensive list of system audit logs
    operationId: getAuditLogs
    tags:
      - Admin
      - Audit Logs
    description: |
      This endpoint allows administrators to retrieve a paginated and filterable list of all system audit logs.
      Audit logs provide a detailed, immutable history of actions performed within the system, including who performed the action,
      what resource was affected, when it happened, and any relevant contextual information.
      It is crucial for security monitoring, compliance, incident response, and debugging purposes in a large-scale production environment.
      The endpoint supports extensive filtering capabilities to pinpoint specific events or trends.
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
        description: The page number to retrieve for paginated results. Each page contains a subset of the total audit logs.
        example: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
        description: The number of audit log entries to return per page. A higher page size retrieves more data per request, up to a maximum of 100.
        example: 50
      - in: query
        name: sortBy
        schema:
          type: string
          enum:
            - timestamp
            - actor.id
            - eventType
            - resource.type
            - severity
            - status
        description: |
          Field to sort the audit logs by.
          - `timestamp`: Sorts by the time the event occurred (default).
          - `actor.id`: Sorts by the unique identifier of the actor.
          - `eventType`: Sorts by the type of event.
          - `resource.type`: Sorts by the type of resource affected.
          - `severity`: Sorts by the severity level of the log.
          - `status`: Sorts by the outcome status of the action.
        example: timestamp
      - in: query
        name: sortOrder
        schema:
          type: string
          enum:
            - asc
            - desc
          default: desc
        description: The order to sort the results (ascending or descending). `desc` (descending) is typically used for audit logs to show the most recent events first.
        example: desc
      - in: query
        name: actorId
        schema:
          type: string
          format: uuid
        description: Filter logs by the unique identifier of the actor (user, system, or API key) who performed the action. This allows tracing all actions by a specific entity.
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
      - in: query
        name: eventType
        schema:
          type: string
          enum:
            - USER_LOGIN
            - USER_LOGOUT
            - USER_CREATED
            - USER_UPDATED
            - USER_DELETED
            - RESOURCE_CREATED
            - RESOURCE_UPDATED
            - RESOURCE_DELETED
            - SETTINGS_UPDATED
            - PERMISSION_GRANTED
            - PERMISSION_REVOKED
            - API_KEY_CREATED
            - API_KEY_DELETED
            - SYSTEM_ERROR
            - DATA_EXPORTED
            - DATA_IMPORTED
            - CONFIGURATION_CHANGE
            - SECURITY_ALERT
            - PAYMENT_PROCESSED
            - REFUND_ISSUED
        description: |
          Filter logs by the specific type of event that occurred. This is useful for focusing on particular categories of actions,
          such as all user logins or all resource creation events.
        example: USER_LOGIN
      - in: query
        name: resourceType
        schema:
          type: string
          enum:
            - User
            - Product
            - Order
            - Settings
            - Role
            - Permission
            - ApiKey
            - Report
            - Database
            - Server
            - Service
        description: |
          Filter logs by the type of resource that was affected by the action.
          For example, filtering by `User` will show all actions related to user accounts.
        example: User
      - in: query
        name: resourceId
        schema:
          type: string
          format: uuid
        description: Filter logs by the unique identifier of the specific resource that was affected. This allows deep dives into the history of a single entity.
        example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      - in: query
        name: startDate
        schema:
          type: string
          format: date-time
        description: Filter logs to include only those that occurred on or after this ISO 8601 date-time (e.g., `2023-01-01T00:00:00Z`). Useful for time-based analysis.
        example: '2023-01-01T00:00:00Z'
      - in: query
        name: endDate
        schema:
          type: string
          format: date-time
        description: Filter logs to include only those that occurred on or before this ISO 8601 date-time (e.g., `2023-12-31T23:59:59Z`). Useful for defining a specific time window.
        example: '2023-12-31T23:59:59Z'
      - in: query
        name: ipAddress
        schema:
          type: string
          format: ipv4
        description: Filter logs by the IPv4 address from which the action originated. Essential for security investigations to identify suspicious access patterns.
        example: 192.168.1.100
      - in: query
        name: userAgent
        schema:
          type: string
        description: Filter logs by the user agent string of the client that performed the action. Helps in understanding the client environment (browser, OS, API client).
        example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
      - in: query
        name: status
        schema:
          type: string
          enum:
            - SUCCESS
            - FAILURE
            - PENDING
        description: Filter logs by the outcome status of the action. Useful for quickly identifying failed operations or pending tasks.
        example: FAILURE
      - in: query
        name: severity
        schema:
          type: string
          enum:
            - INFO
            - WARNING
            - ERROR
            - CRITICAL
        description: Filter logs by their severity level. Allows administrators to prioritize review of critical issues.
        example: CRITICAL
      - in: header
        name: X-Request-ID
        schema:
          type: string
          format: uuid
        description: |
          Unique identifier for the request, useful for tracing and correlating logs across different services
          in a distributed system architecture. This ID should be generated by the client and passed with the request.
        example: 8e2a4b7c-1d3e-4f5a-6b7c-8d9e0f1a2b3c
      - in: header
        name: Accept-Language
        schema:
          type: string
          default: en-US
        description: |
          Preferred language for the response content, specified as an IETF language tag (e.g., `en-US`, `fr-FR`).
          This header influences the localization of human-readable fields in the response.
        example: en-US
    responses:
