title: Secret
description: >-
  Represents a sensitive piece of information, such as an API key, password, or
  certificate. Secrets are write-only; their value can be provided upon creation
  or update but is never returned in API responses. Instead, a masked value or
  metadata is provided for identification.
type: object
properties:
  id:
    type: string
    format: uuid
    description: The unique identifier for the secret.
    readOnly: true
    example: 'sec_a1b2c3d4-e5f6-7890-1234-567890abcdef'
  name:
    type: string
    description: A human-readable name for the secret to help identify its purpose.
    minLength: 1
    maxLength: 255
    example: 'Production Database Password'
  value:
    type: string
    format: password
    description: >-
      The sensitive value of the secret. This field is write-only and will be
      masked or omitted in all API responses for security reasons. It must be
      provided when creating a new secret.
    writeOnly: true
    example: 's3cr3t_p@ssw0rd_v@lu3_f0r_pr0d_DB'
    minLength: 8
  value_masked:
    type: string
    description: >-
      A masked representation of the secret value, typically showing the prefix
      and/or suffix. This is returned in API responses instead of the actual
      value to prevent accidental exposure.
    readOnly: true
    example: 's3cr3t_p@ssw0rd_****_pr0d_DB'
  type:
    type: string
    description: The type of the secret, which can help in its management, validation, and usage.
    enum:
      - api_key
      - password
      - ssh_key
      - certificate
      - database_credentials
      - generic
    example: 'database_credentials'
  visibility:
    type: string
    description: >-
      Controls the visibility and access level of the secret within the
      organization or project. 'private' secrets are only visible to the
      creator, 'project' to members of an associated project, and 'organization'
      to all members of the organization.
    enum:
      - private
      - project
      - organization
    default: 'private'
    example: 'project'
  project_id:
    type: string
    format: uuid
    description: >-
      The unique identifier of the project this secret is associated with.
      Required if visibility is set to 'project'.
    nullable: true
    example: 'proj_09876543-21fe-dcba-9876-543210fedcba'
  created_at:
    type: string
    format: date-time
    description: The timestamp (ISO 8601 format) when the secret was created.
    readOnly: true
    example: '2023-10-27T10:00:00Z'
  updated_at:
    type: string
    format: date-time
    description: The timestamp (ISO 8601 format) when the secret was last updated.
    readOnly: true
    example: '2023-10-27T12:30:00Z'
  last_accessed_at:
    type: string
    format: date-time
    description: >-
      The timestamp (ISO 8601 format) when the secret's value was last revealed
      or used. Can be null if never accessed.
    readOnly: true
    nullable: true
    example: '2023-10-28T09:15:00Z'
  expires_at:
    type: string
    format: date-time
    description: >-
      The timestamp (ISO 8601 format) when the secret will expire and become
      invalid. Can be null for secrets that do not expire.
    nullable: true
    example: '2024-10-27T10:00:00Z'
  metadata:
    type: object
    description: >-
      A set of key-value pairs that can be used to store additional,
      non-sensitive metadata about the secret. Keys must be strings, and values
      can be strings, numbers, or booleans.
    additionalProperties:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: 'null'
    example:
      environment: 'production'
      rotation_policy_id: 'rot_67890'
      owner_team: 'backend-infra'
      is_critical: true
  tags:
    type: array
    description: A list of tags for organizing, searching, and filtering secrets.
    items:
      type: string
      minLength: 1
      maxLength: 50
    example:
      - database
      - production
      - critical
      - rds
required:
  - name
  - value
  - type
example:
  id: 'sec_a1b2c3d4-e5f6-7890-1234-567890abcdef'
  name: 'Production Database Password'
  value_masked: 's3cr3t_p@ssw0rd_****_pr0d_DB'
  type: 'database_credentials'
  visibility: 'project'
  project_id: 'proj_09876543-21fe-dcba-9876-543210fedcba'
  created_at: '2023-10-27T10:00:00Z'
  updated_at: '2023-10-27T12:30:00Z'
  last_accessed_at: '2023-10-28T09:15:00Z'
  expires_at: '2024-10-27T10:00:00Z'
  metadata:
    environment: 'production'
    rotation_policy_id: 'rot_67890'
    owner_team: 'backend-infra'
    is_critical: true
  tags:
    - database
    - production
    - critical
    - rds