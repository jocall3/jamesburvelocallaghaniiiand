type: object
title: Secret Value
description: |-
  Represents the revealed value of a secret. This object is returned only when a user with sufficient permissions explicitly requests to view the secret's content. The value is sensitive and should be handled with extreme care.
x-comment: This schema is intentionally simple to minimize the surface area of sensitive data exposure. It contains only the secret's value and metadata about its retrieval.
properties:
  value:
    type: string
    format: byte
    description: |-
      The actual secret value, base64-encoded. This is highly sensitive information and should never be logged or stored insecurely. Clients must decode the base64 string to access the raw secret content.
    example: "cGFzc3dvcmQxMjMhQGtleV92YWx1ZQ=="
  retrieved_at:
    type: string
    format: date-time
    description: The UTC timestamp indicating when this secret value was retrieved and revealed. This can be used for auditing and security purposes.
    example: '2023-05-21T14:35:10Z'
  expires_at:
    type: string
    format: date-time
    description: An optional UTC timestamp indicating when this revealed value should be considered expired. Clients should not cache or use the value beyond this point. This is often used for short-lived access tokens or temporary credentials.
    example: '2023-05-21T14:40:10Z'
required:
  - value
  - retrieved_at