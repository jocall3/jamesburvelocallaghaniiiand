type: object
description: Represents a physical or logical location within the infrastructure, such as a geographical region, a data center, an availability zone, a room, or a specific rack. Locations can be nested to form a hierarchy.
properties:
  id:
    type: string
    format: uuid
    description: The unique identifier for the location. This is a system-generated value.
    example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
    readOnly: true
  name:
    type: string
    description: The human-readable name of the location. This name should be unique within its parent location.
    example: "US East (N. Virginia)"
    minLength: 1
    maxLength: 100
  slug:
    type: string
    description: A URL-friendly, unique slug for the location. Typically a lowercase, hyphenated version of the name, generated automatically.
    example: "us-east-1"
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    readOnly: true
  type:
    type: string
    description: The type of the location, defining its role in the hierarchy.
    enum:
      - region
      - data_center
      - availability_zone
      - room
      - rack
      - virtual
    example: "region"
  status:
    type: string
    description: The operational status of the location.
    enum:
      - planned
      - staging
      - active
      - decommissioning
      - retired
    default: "active"
    example: "active"
  description:
    type: string
    description: A detailed description of the location, its purpose, and any relevant notes. Supports markdown.
    example: "Primary region for North American operations, hosted in Ashburn, VA. Provides access to availability zones us-east-1a and us-east-1b."
    maxLength: 5000
  parent_location_id:
    type: string
    format: uuid
    description: The unique identifier of the parent location in the hierarchy. Null for top-level locations like regions.
    nullable: true
    example: null
  site_code:
    type: string
    description: A short, unique, human-readable code for a physical site or data center (e.g., an IATA airport code).
    example: "IAD42"
    nullable: true
    maxLength: 20
  facility_provider:
    type: string
    description: The name of the third-party provider for the physical facility (e.g., Equinix, Digital Realty).
    example: "Equinix"
    nullable: true
  physical_address:
    type: object
    description: The physical street address of the location, if applicable.
    nullable: true
    properties:
      street_address_1:
        type: string
        description: The primary line of the street address.
        example: "21715 Filigree Ct"
      street_address_2:
        type: string
        description: The secondary line of the street address (e.g., Suite, Floor, Building).
        example: "Building B, Suite 100"
        nullable: true
      city:
        type: string
        description: The city where the location resides.
        example: "Ashburn"
      state_province:
        type: string
        description: The state, province, or region.
        example: "Virginia"
      postal_code:
        type: string
        description: The postal or ZIP code.
        example: "20147"
      country:
        type: string
        description: The ISO 3166-1 alpha-2 country code.
        example: "US"
    required:
      - street_address_1
      - city
      - state_province
      - postal_code
      - country
  gps_coordinates:
    type: object
    description: The geographical coordinates of the location, useful for mapping and latency calculations.
    nullable: true
    properties:
      latitude:
        type: number
        format: double
        description: The latitude of the location in decimal degrees.
        example: 39.0437
        minimum: -90
        maximum: 90
      longitude:
        type: number
        format: double
        description: The longitude of the location in decimal degrees.
        example: -77.4875
        minimum: -180
        maximum: 180
    required:
      - latitude
      - longitude
  time_zone:
    type: string
    description: The IANA time zone name for the location (e.g., 'America/New_York').
    example: "America/New_York"
    nullable: true
  rack_details:
    type: object
    description: Specific details applicable only to locations of type 'rack'. This field will be null for other location types.
    nullable: true
    properties:
      rack_units:
        type: integer
        description: The total number of vertical rack units (U) available in the rack.
        example: 42
        minimum: 1
      rack_width_inches:
        type: integer
        description: The width of the rack in inches, typically for mounting equipment.
        enum: [19, 21, 23]
        default: 19
        example: 19
      rack_depth_mm:
        type: integer
        description: The depth of the rack in millimeters.
        example: 1070
        nullable: true
      outer_dimensions:
        type: object
        description: The outer physical dimensions of the rack cabinet.
        properties:
          height_mm:
            type: integer
            example: 2000
          width_mm:
            type: integer
            example: 600
          depth_mm:
            type: integer
            example: 1200
        nullable: true
      power_feed_type:
        type: string
        description: The type of power feed available to the rack.
        enum: ["AC_SINGLE_PHASE", "AC_THREE_PHASE", "DC"]
        example: "AC_THREE_PHASE"
    required:
      - rack_units
      - rack_width_inches
  tags:
    type: array
    description: A list of tags for organizing and filtering locations.
    items:
      type: string
      example: "production"
      minLength: 1
    example: ["production", "pci-compliant", "high-availability"]
  custom_fields:
    type: object
    description: A key-value map for storing custom metadata. The keys are user-defined and the values are strings.
    additionalProperties:
      type: string
      description: The value for a custom field.
    example:
      contact_person: "jane.doe@example.com"
      access_procedure: "Requires 24-hour notice and badge access."
      on_site_support_tier: "Gold"
  created_at:
    type: string
    format: date-time
    description: The timestamp when the location was created in the system, in ISO 8601 format.
    example: "2023-04-12T14:30:00Z"
    readOnly: true
  updated_at:
    type: string
    format: date-time
    description: The timestamp when the location was last updated, in ISO 8601 format.
    example: "2023-10-26T09:15:00Z"
    readOnly: true
required:
  - id
  - name
  - slug
  - type
  - status
  - created_at
  - updated_at