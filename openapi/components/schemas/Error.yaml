type: object
description: |-
  A problem details object (RFC 7807) for reporting errors in a standard way.
  This schema provides a consistent and machine-readable format for error responses across the API,
  facilitating automated error handling on the client side. It includes standard fields like type, title,
  and status, along with optional extensions for detailed validation errors and request tracing.
externalDocs:
  description: "RFC 7807: Problem Details for HTTP APIs"
  url: "https://tools.ietf.org/html/rfc7807"
properties:
  type:
    type: string
    format: uri
    description: |-
      A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML). When this member is not present, its value is assumed to be "about:blank".
    example: "https://api.example.com/problems/validation-error"
    default: "about:blank"
  title:
    type: string
    description: |-
      A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
    example: "Validation Error"
  status:
    type: integer
    format: int32
    description: |-
      The HTTP status code generated by the origin server for this occurrence of the problem.
    minimum: 400
    maximum: 599
    example: 400
  detail:
    type: string
    description: |-
      A human-readable explanation specific to this occurrence of the problem. This field may be used to provide more context about the error.
    example: "One or more fields submitted in the request body did not pass validation."
  instance:
    type: string
    format: uri-reference
    description: |-
      A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
    example: "/requests/a1b2c3d4-e5f6-7890-1234-567890abcdef"
  traceId:
    type: string
    format: uuid
    description: |-
      A unique identifier for the request, used for tracing and correlation in logs. Providing this ID when reporting an issue can help expedite the troubleshooting process.
    example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
  errors:
    type: array
    description: |-
      An array of validation error objects, providing details about each specific field that failed validation. This is a common extension to RFC 7807 for providing structured validation error details.
    items:
      type: object
      properties:
        field:
          type: string
          description: "The path to the field that failed validation. Can be a dot-separated path for nested objects."
          example: "user.email"
        code:
          type: string
          description: "A machine-readable error code for the specific validation failure."
          example: "invalid_format"
        message:
          type: string
          description: "A human-readable message explaining the validation failure for this specific field."
          example: "The provided email address is not in a valid format."
      required:
        - field
        - code
        - message
required:
  - type
  - title
  - status
example:
  type: "https://api.example.com/problems/validation-error"
  title: "Validation Error"
  status: 400
  detail: "The request body is invalid. See the 'errors' field for more details."
  instance: "/requests/a1b2c3d4-e5f6-7890-1234-567890abcdef"
  traceId: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
  errors:
    - field: "user.name"
      code: "missing_required_field"
      message: "The 'name' field is required."
    - field: "user.email"
      code: "invalid_format"
      message: "The provided email address 'john.doe' is not in a valid format."
    - field: "age"
      code: "value_out_of_range"
      message: "Age must be between 18 and 99."