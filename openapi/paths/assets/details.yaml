get:
  summary: Retrieve dynamic details for a specific asset
  operationId: getAssetDynamicDetails
  tags:
    - Assets
    - Details
  description: |
    Fetches a comprehensive, dynamically generated details object for a specific asset identified by its unique ID.
    This endpoint provides a flexible structure to accommodate various types of asset details,
    which can include technical specifications, operational metrics, financial data, historical logs,
    and custom attributes, depending on the asset's type and configuration.
    The response schema is designed to be highly extensible, allowing for a wide range of data
    to be returned without requiring frequent API version changes.
    It is crucial for systems requiring deep insights into individual asset characteristics
    for analytics, maintenance scheduling, compliance reporting, and strategic planning.
    The level of detail returned can be controlled via query parameters to optimize payload size
    and processing time for different use cases.
  parameters:
    - in: path
      name: id
      schema:
        type: string
        format: uuid
        description: |
          The globally unique identifier (UUID v4) of the asset for which to retrieve its dynamic details.
          This ID is immutable and serves as the primary key for asset identification across the system.
      required: true
      example: 123e4567-e89b-12d3-a456-426614174000
    - in: header
      name: X-Request-ID
      schema:
        type: string
        format: uuid
        description: |
          A unique identifier for the request, useful for tracing and debugging purposes across distributed systems.
          If not provided by the client, the server will generate one and include it in the response headers.
      required: false
      example: a1b2c3d4-e5f6-7890-1234-567890abcdef
    - in: query
      name: includeHistoricalData
      schema:
        type: boolean
        default: false
        description: |
          Set to `true` to include extensive historical data, event logs, and detailed audit trails
          within the asset details. This can significantly increase response size and processing time.
          Defaults to `false` to provide a lighter, current state view.
      required: false
      example: true
    - in: query
      name: fields
      schema:
        type: array
        items:
          type: string
        collectionFormat: csv
        description: |
          A comma-separated list of top-level fields or nested properties to include in the response.
          If specified, only these fields and their nested properties will be returned, optimizing payload size.
          If omitted, all available fields are returned.
          Example: `name,technicalSpecifications.modelNumber,financialData.currentValuation`
      required: false
      example: "name,status,operationalMetrics.uptimeHours,customFields"
    - in: query
      name: version
      schema:
        type: string
        description: |
          Specifies a particular version of the asset's details to retrieve, if versioning is supported.
          This could be a timestamp, a commit hash, or a semantic version string.
          If not provided, the latest available version is returned.
      required: false
      example: "2024-07-15T10:00:00Z"
  responses:
    200:
      description: Successfully retrieved the dynamic details for the specified asset.
