tags:
  - Assets
summary: Remove an Asset
description: |
  Permanently removes a specific asset from the system by its unique identifier. This action is irreversible and will also delete all associated metadata, renditions, and historical data. Ensure that the asset is no longer in use or required before proceeding.

  **Permissions:**
  - Requires an authentication token with the `assets:write` or `assets:delete` scope.
  - The user must have ownership or administrative privileges over the asset being deleted.
operationId: deleteAsset
parameters:
  - name: id
    in: path
    description: The universally unique identifier (UUID) of the asset to be deleted.
    required: true
    schema:
      type: string
      format: uuid
      description: A standard UUID (version 4) identifying the asset.
    example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
security:
  - OAuth2Security:
      - assets:write
      - assets:delete
responses:
  '204':
    description: |
      Asset successfully deleted.
      The server has successfully fulfilled the request and there is no additional content to send in the response payload body.
  '400':
    description: Bad Request. The request could not be understood by the server due to malformed syntax. This is often due to an invalid asset ID format.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          error:
            code: 'INVALID_PARAMETER'
            message: 'Invalid asset ID format.'
            target: 'id'
            details: 'The provided asset ID "d290f1ee" does not conform to the standard UUID format.'
  '401':
    description: Unauthorized. The request has not been applied because it lacks valid authentication credentials for the target resource.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          error:
            code: 'UNAUTHENTICATED'
            message: 'Authentication token is missing, expired, or invalid.'
  '403':
    description: Forbidden. The server understood the request but refuses to authorize it. The authenticated user does not have the necessary permissions to delete this specific asset.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          error:
            code: 'PERMISSION_DENIED'
            message: 'You do not have permission to delete this asset.'
            details: 'Deleting this asset requires "assets:delete" scope and ownership of the resource.'
  '404':
    description: Not Found. The server cannot find the requested asset. The asset with the specified ID does not exist.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          error:
            code: 'NOT_FOUND'
            message: 'Asset not found.'
            details: 'No asset exists with the ID: d290f1ee-6c54-4b01-90e6-d701748f0851'
  '500':
    description: Internal Server Error. The server encountered an unexpected condition that prevented it from fulfilling the request.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          error:
            code: 'INTERNAL_SERVER_ERROR'
            message: 'An unexpected error occurred while processing your request.'
            details: 'The engineering team has been notified. Please try again later.'
            requestId: 'a1b2c3d4-e5f6-7890-1234-567890abcdef'