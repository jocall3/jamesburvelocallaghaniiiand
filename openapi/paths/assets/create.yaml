post:
  tags:
    - Assets
  summary: Create a new asset
  description: |
    Creates a new asset record in the system. This is the primary endpoint for adding new content, whether by providing a link to an external source or by initiating an upload process.

    When creating an asset, you can specify its type, name, metadata, and placement within a folder structure. The system will generate a unique ID for the asset and return its full representation.

    For direct file uploads, this endpoint should be used to create the asset metadata record first. The response will typically include a pre-signed URL for the client to upload the file content directly to the storage backend. The asset's status will be 'pending_upload' until the file is successfully uploaded and processed.
  operationId: createAsset
  requestBody:
    description: The asset to create. Provide either a `source_url` for linked assets or `file_details` for assets that will be uploaded directly.
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/assets/AssetCreate.yaml'
        examples:
          create_image_from_url:
            summary: Create an image asset from a URL
            description: An example of creating a new image asset by linking to an external URL. The system will fetch and process the image asynchronously.
            value:
              name: "Corporate Logo Q3 2024"
              description: "The official company logo for the third quarter of 2024."
              asset_type: "image"
              source_url: "https://example.com/images/logo_q3_2024.png"
              folder_id: "fld-a1b2c3d4-e5f6-7890-1234-567890abcdef"
              tags:
                - "logo"
                - "branding"
                - "2024"
              metadata:
                project_id: "proj-9876"
                campaign: "Q3 Marketing"
                approved_by: "user-jane-doe"
          create_video_for_upload:
            summary: Create a video asset record for direct upload
            description: An example of creating a video asset record in preparation for a direct file upload. The response will contain details for the upload process.
            value:
              name: "Product Demo Video"
              description: "A short demonstration of the new product features."
              asset_type: "video"
              file_details:
                filename: "product_demo_final.mp4"
                size: 52428800
                mime_type: "video/mp4"
                checksum: "md5:d41d8cd98f00b204e9800998ecf8427e"
              folder_id: "fld-b2c3d4e5-f6a7-8901-2345-67890abcdef1"
              tags:
                - "product"
                - "demo"
                - "video"
              metadata:
                duration_seconds: 125
                resolution: "1920x1080"
                codec: "H.264"
  responses:
    '201':
      description: |
        Asset created successfully. The response body contains the full details of the newly created asset.
        If the asset was created for a direct upload, the `upload_details` field will contain the necessary information, such as a pre-signed URL, to upload the file content.
      headers:
        Location:
          description: The URL of the newly created asset.
          schema:
            type: string
            format: uri
            example: /api/v1/assets/ast-11223344-5566-7788-9900-aabbccddeeff
        ETag:
          description: The ETag of the newly created asset, used for caching and conditional requests.
          schema:
            type: string
            example: '"a1b2c3d4e5f67890"'
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/assets/Asset.yaml'
          examples:
            asset_created_from_url:
              summary: Response for an asset created from a URL
              value:
                id: "ast-11223344-5566-7788-9900-aabbccddeeff"
                name: "Corporate Logo Q3 2024"
                description: "The official company logo for the third quarter of 2024."
                asset_type: "image"
                status: "processing"
                version: 1
                size_bytes: 0
                mime_type: null
                folder_id: "fld-a1b2c3d4-e5f6-7890-1234-567890abcdef"
                owner_id: "usr-fedcba98-7654-3210-fedc-ba9876543210"
                created_at: "2024-07-27T10:00:00Z"
                updated_at: "2024-07-27T10:00:00Z"
                source_url: "https://example.com/images/logo_q3_2024.png"
                tags:
                  - "logo"
                  - "branding"
                  - "2024"
                metadata:
                  project_id: "proj-9876"
                  campaign: "Q3 Marketing"
                  approved_by: "user-jane-doe"
                access_control:
                  visibility: "private"
                  allowed_users: []
                  allowed_groups: []
            asset_created_for_upload:
              summary: Response for an asset created for direct upload
              value:
                id: "ast-22334455-6677-8899-00aa-bbccddeeff11"
                name: "Product Demo Video"
                description: "A short demonstration of the new product features."
                asset_type: "video"
                status: "pending_upload"
                version: 1
                size_bytes: 52428800
                mime_type: "video/mp4"
                folder_id: "fld-b2c3d4e5-f6a7-8901-2345-67890abcdef1"
                owner_id: "usr-fedcba98-7654-3210-fedc-ba9876543210"
                created_at: "2024-07-27T10:05:00Z"
                updated_at: "2024-07-27T10:05:00Z"
                tags:
                  - "product"
                  - "demo"
                  - "video"
                metadata:
                  duration_seconds: 125
                  resolution: "1920x1080"
                  codec: "H.264"
                upload_details:
                  upload_url: "https://storage.googleapis.com/bucket/ast-22334455-6677-8899-00aa-bbccddeeff11?Expires=15...&Signature=..."
                  http_method: "PUT"
                  headers:
                    Content-Type: "video/mp4"
                    Content-MD5: "1B2M2Y8AsgTpgAmY7PhCfg=="
                  expires_at: "2024-07-27T11:05:00Z"
                access_control:
                  visibility: "private"
                  allowed_users: []
                  allowed_groups: []
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '409':
      $ref: '../../components/responses/Conflict.yaml'
    '422':
      $ref: '../../components/responses/UnprocessableEntity.yaml'
    '500':
      $ref: '../../components/responses/InternalServerError.yaml'
  security:
    - OAuth2:
        - assets:write
        - assets:manage