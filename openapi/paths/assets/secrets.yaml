get:
  tags:
    - Assets
    - Secrets
  summary: Retrieve Secrets for an Asset
  description: |
    Fetches all secrets, such as passwords, API keys, SSH keys, or certificates, associated with a specific asset.

    This is a highly sensitive endpoint. Access is strictly controlled by permissions. The caller must have at least `secrets:read` permission for the specified asset.

    The secrets' values are returned encrypted or masked depending on the user's permissions and system configuration. For this documentation, they are shown in plaintext for clarity. In a real-world scenario, additional security layers like a master password might be required to decrypt the values.
  operationId: getAssetSecrets
  parameters:
    - name: id
      in: path
      description: The unique identifier (UUID) of the asset for which to retrieve secrets.
      required: true
      schema:
        type: string
        format: uuid
      example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
  security:
    - bearerAuth:
        - assets:read
        - secrets:read
  responses:
    '200':
      description: Successfully retrieved the list of secrets for the asset. The list may be empty if no secrets are associated.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                description: A list of secrets associated with the asset.
                items:
                  $ref: '../../components/schemas/secrets/Secret.yaml'
          examples:
            successWithMultipleSecretTypes:
              summary: Example with various secret types
              value:
                data:
                  - id: "sec-9f8e7d6c-5b4a-3c2b-1a0f-e9d8c7b6a5b4"
                    assetId: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
                    name: "Production Database Password"
                    description: "Read-only user for the main PostgreSQL database."
                    type: "password"
                    createdAt: "2023-04-15T10:30:00Z"
                    lastUpdatedAt: "2023-08-01T14:00:00Z"
                    value:
                      username: "report_user"
                      passwordValue: "s3cr3t_p@ssw0rd_f0r_db"
                      url: "postgres://db.example.com:5432/production"
                  - id: "sec-1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                    assetId: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
                    name: "AWS API Key"
                    description: "API Key for accessing S3 buckets related to this asset."
                    type: "api_key"
                    createdAt: "2023-05-20T11:00:00Z"
                    lastUpdatedAt: "2023-05-20T11:00:00Z"
                    value:
                      keyValue: "AKIAIOSFODNN7EXAMPLE"
                      secretAccessKey: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
                      service: "AWS S3"
                      permissions: ["s3:GetObject", "s3:ListBucket"]
                  - id: "sec-b1c2d3e4-f5a6-b7c8-d9e0-f1a2b3c4d5e6"
                    assetId: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
                    name: "Server SSH Key"
                    description: "Deployment key for SSH access to the production server."
                    type: "ssh_key"
                    createdAt: "2023-01-10T09:00:00Z"
                    lastUpdatedAt: "2023-06-12T18:25:00Z"
                    value:
                      privateKeyValue: "-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAACFwAAAAdzc2gtcn\nNhAAAAAwEAAQAAAgEA1...REDACTED...-----END OPENSSH PRIVATE KEY-----"
                      publicKey: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQD...REDACTED... deploy@server"
                      keyType: "RSA"
                      bits: 4096
    '400':
      description: Bad Request. The provided asset ID is not in a valid format (e.g., not a UUID).
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Error.yaml'
          example:
            error:
              code: "INVALID_PARAMETER"
              message: "The asset ID '12345' is not a valid UUID."
              target: "id"
    '401':
      description: Unauthorized. The request lacks valid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Error.yaml'
          example:
            error:
              code: "UNAUTHENTICATED"
              message: "Authentication token is missing or invalid."
    '403':
      description: Forbidden. The authenticated user does not have the necessary permissions to view secrets for this asset.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Error.yaml'
          example:
            error:
              code: "PERMISSION_DENIED"
              message: "You do not have 'secrets:read' permission for asset 'a1b2c3d4-e5f6-7890-1234-567890abcdef'."
    '404':
      description: Not Found. The asset with the specified ID does not exist.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Error.yaml'
          example:
            error:
              code: "NOT_FOUND"
              message: "Asset with ID 'a1b2c3d4-e5f6-7890-1234-567890abcdef' not found."
    '500':
      description: Internal Server Error. An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Error.yaml'
          example:
            error:
              code: "INTERNAL_SERVER_ERROR"
              message: "An unexpected error occurred while processing your request. Please try again later."
              requestId: "req-a9b8c7d6-e5f4-g3h2-i1j0"